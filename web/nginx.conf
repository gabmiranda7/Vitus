# Mantém https quando um proxy na frente (nginx do host) já terminou o TLS
map $http_x_forwarded_proto $proto_repassado {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads de exames: a API limita o corpo a 15MB
    client_max_body_size 16m;

    # Só confia no X-Forwarded-For vindo da rede Docker ou de uma rede privada
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $proto_repassado;

        # Análise de exame por IA pode demorar mais que o padrão de 60s
        proxy_read_timeout 400s;
        proxy_send_timeout 400s;
    }
}